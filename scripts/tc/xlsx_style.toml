# xlsx_style.toml — presentation policy for `make xlsx-view` / `make xlsx-preview`.
#
# This file is STYLE, not data. It controls only how test_cases.xlsx LOOKS — never what it
# contains. The content comes from test_cases.csv / test_cases_index.csv (generated by
# `make testcases` from design_notes.md). See .claude/refs/csv-schema.md §The presentation view.
#
# Edit freely, then re-render: `make xlsx-view` (or `make xlsx-preview` for the colour-scope
# comparison workbook). Read by scripts/tc/build-xlsx.py via tomllib (stdlib, Python >= 3.11).
#
# Colour format: "RRGGBB" hex, no leading '#'. Each palette entry is [fill, font].
#
# VISUAL SOURCE: this palette and layout policy is copied from preferred_style.xlsx
# (sheet Bankruptcy_Receivership) — the team's canonical TCM formatting reference. It
# replaces the older grey/navy-banner, light-blue-mark design (kept nowhere now; that
# design is the documented ANTI-reference). Only the LOOK moved — column set, merge
# rules, and cell values still come entirely from the CSVs.

# ── Colour scope — THE OPEN DECISION (see the block comment further down for the full
# description). Keep it here, ABOVE every [table] header: in TOML a top-level key written
# after a [table] header silently becomes a key OF that table. `make xlsx-preview` renders
# all three scopes into one comparison workbook so the choice is made in Excel, not in chat.
color_scope = "cell_tint"        # cell_tint | row_tint | banding

[merge]
# Columns that vary per STEP — never merged, always top-aligned. Everything else (case-level
# columns AND the whole matrix block) is merged across each case's contiguous step rows.
step_columns = ["Step_No", "Test_Step", "Expected_Result", "Status", "Basis_Ref"]

[header]
# 2-tier grouped banner: row 1 merges one banner per matrix group (the prefix before ' ·' in
# the column name — AC, END, RULE, EP, BVA, DT, ST, EXC), row 2 carries the value names.
# Case columns are merged vertically across both rows and styled as the MAIN (dark navy)
# header, matching preferred_style.xlsx's left-hand descriptive columns. The matrix banner
# row uses the "Level 1 — main matrix group" colour and the leaf/value row uses the
# "matrix leaf" colour, both from preferred_style.xlsx's semantic palette — our data model
# only has two matrix tiers (group, value), so no L2/L3 mid-tier is invented.
matrix_banner = true
header_fill = "1F3864"           # main (case-level) header — preferred_style dark navy
header_font = "FFFFFF"
banner_fill = "A4C2F4"           # matrix group banner — preferred_style L1 colour
banner_font = "000000"
leaf_fill = "D9EAD3"             # matrix leaf/value row — preferred_style leaf colour
leaf_font = "000000"
matrix_header_rotation = 90      # degrees for tier-2 matrix names; 0 to disable
banner_height = 18
value_header_height = 90

[freeze]
# preferred_style.xlsx freezes only the header ROWS — no column lock ("do NOT freeze
# column A unless specifically required"). freeze_first_column stays here as an escape
# hatch but defaults off; the frozen row count is derived from the header tier count.
freeze_first_column = false

[colors.matrix_mark]
# Plain black 'x' on white, centred, thin black border — preferred_style §6. The old
# light-blue-highlighted mark (#DDEBF7 fill / navy font) is the documented anti-pattern.
fill = "FFFFFF"
font = "000000"

# ── Value palettes ────────────────────────────────────────────────────────────────
# Keyed by lowercase cell value. An UNKNOWN value is left uncoloured and warned on stderr —
# a new status must show up as unstyled, never silently wear another meaning's colour.

[colors.test_type]
positive  = ["C6EFCE", "006100"]
negative  = ["FFC7CE", "9C0006"]
boundary  = ["FFEB9C", "9C6500"]
exception = ["E4DFEC", "5B3A8C"]
security  = ["F8CBAD", "833C00"]

[colors.priority]
p1 = ["E06666", "FFFFFF"]
p2 = ["FFD966", "000000"]
p3 = ["93C47D", "000000"]

[colors.status]
# Passed / Failed / Blocked match preferred_style.xlsx's conditional-format colours
# exactly (§7). "not run" / "skipped" are this project's own status vocabulary (the
# reference's "Pending" / "PWC" / "Defered" values don't exist here — content stays
# ours, only the colour system is borrowed). Applied via real conditional-formatting
# rules on the Status column, not a static fill baked in at write time — see build-xlsx.py.
"not run" = ["D9D9D9", "404040"]
passed    = ["C6EFCE", "006100"]
failed    = ["FFC7CE", "9C0006"]
blocked   = ["D8D8D8", "000000"]
skipped   = ["FFF2CC", "7F6000"]

# ── Colour scope — the open decision ──────────────────────────────────────────────
# Which of these three governs the Test Cases sheet. `make xlsx-preview` renders ALL THREE
# side by side (one sheet each) so the choice is made in Excel, not in chat; once picked,
# set `color_scope` (top of this file) and `make xlsx-view` uses it.
#
#   cell_tint — colour only the Test_Type / Priority / Status cells + matrix 'x' marks.
#               Colours never collide; cell values stay maximally legible. (current default)
#   row_tint  — additionally tint the WHOLE step row with a pale wash of its Test_Type.
#               Type is visible at a glance, like the reference sheet; pale washes below.
#   banding   — additionally alternate white / pale grey per CASE BLOCK, so case boundaries
#               read even without looking at merge borders. Calmest; slowest to scan type.

[row_tint.wash]                  # pale per-type washes used when color_scope = "row_tint"
positive  = "EAF6EC"
negative  = "FDECEE"
boundary  = "FFF8E3"
exception = "F4F1F9"
security  = "FDF0E9"

[banding]                        # used when color_scope = "banding"
even_fill = "FFFFFF"
odd_fill  = "F2F2F2"

[page]
# preferred_style.xlsx §14: landscape, zero margins, ~100% zoom, dense wide-TCM view.
orientation = "landscape"
margins = 0.0
zoom = 100

# ── Layout ────────────────────────────────────────────────────────────────────────

[widths]
default = 14
matrix = 5
Test_Case_ID = 22
Preconditions = 32
Test_Data = 42
Test_Description = 40
Step_No = 7
Test_Step = 46
Expected_Result = 58
Status = 10
Automatable = 11
Automation_ID = 24
Test_Type = 11
Defect_ID = 10
Notes = 26
REQ_ID = 9
US_ID = 9
AC_Ref = 12
Test_Level = 9
Design_Technique = 11
Priority = 9
Postcondition = 32
Env_Scope = 10
Basis_Ref = 34

[wrap]
columns = ["Preconditions", "Test_Data", "Test_Description", "Test_Step",
           "Expected_Result", "Notes", "Postcondition", "Basis_Ref"]

# ── Preview workbook (make xlsx-preview) ──────────────────────────────────────────
# A small, gitignored sample (xlsx_style_preview.xlsx) that renders the same rows under all
# three colour scopes so the team can pick one in Excel. Case selection is automatic and
# CONTIGUOUS — the narrowest window of at most max_cases cases covering every Test_Type,
# Priority, and Status present in the file, with at least min_multi_step multi-step cases
# (to show merging). Contiguity matters: the preview is a real slice of the sheet, so merges,
# banding and borders behave exactly as in the full file. No case IDs are hardcoded, so the
# preview survives case churn. If no window within max_cases covers everything (a lone rare
# value far from the rest — e.g. a single `security` case), the best-coverage window is used
# and stderr names the values left out; raise max_cases to pull them in.

[preview]
output = "xlsx_style_preview.xlsx"
max_cases = 8
min_multi_step = 1
